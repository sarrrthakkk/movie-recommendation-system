seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  relevance_threshold: 4.0
  minimum_positive_interactions: 3
matrix_factorization:
  latent_dimensions: 50
  learning_rate: 0.005
  regularization: 0.01
  epochs: 50
  batch_size: 1024
  patience: 5
  device: auto
popularity:
  prior_strength: 10
hybrid:
  alpha_values:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  top_k_candidates: 20
evaluation:
  k_values:
  - 5
  - 10
  llm_sample_users: 100
  stratify_sample_users: true
  explanation_audit_samples: 50
  bootstrap_resamples: 1000
llm:
  model: qwen35-27b
  temperature: 0.0
  max_tokens: 512
  requests_per_minute: 6
  concurrency: 1
  request_timeout_seconds: 100.0
  maximum_retries: 3
  retry_base_seconds: 2.0
  maximum_candidates: 20
  maximum_positive_history: 10
  maximum_negative_history: 5
  tmdb_cache_path: data/processed/tmdb_metadata.json
  use_tmdb_metadata: true
  max_plot_chars: 220
artifacts_dir: artifacts

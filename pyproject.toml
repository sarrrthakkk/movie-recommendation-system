[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recommender"
version = "0.1.0"
description = "Hybrid movie recommendation using matrix factorization and LLM-based reranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.5",
    "httpx>=0.27",
    "streamlit>=1.32",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
